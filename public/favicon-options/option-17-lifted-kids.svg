<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#3A7D5C"/>

  <!-- Left parent lifting child up -->
  <circle cx="155" cy="230" r="28" fill="#F0DCC8"/>
  <line x1="155" y1="258" x2="155" y2="360" stroke="#F0DCC8" stroke-width="13" stroke-linecap="round"/>
  <!-- Left arm down -->
  <line x1="155" y1="290" x2="110" y2="330" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <!-- Right arm lifting child up -->
  <line x1="155" y1="290" x2="200" y2="180" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <line x1="155" y1="360" x2="130" y2="440" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <line x1="155" y1="360" x2="180" y2="440" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>

  <!-- Child 1 being lifted (left side) -->
  <circle cx="210" cy="140" r="20" fill="#C65D28"/>
  <line x1="210" y1="160" x2="210" y2="220" stroke="#C65D28" stroke-width="9" stroke-linecap="round"/>
  <!-- Arms spread joyfully -->
  <line x1="210" y1="178" x2="180" y2="160" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="210" y1="178" x2="240" y2="158" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="210" y1="220" x2="195" y2="260" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="210" y1="220" x2="225" y2="260" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>

  <!-- Right parent lifting child up -->
  <circle cx="357" cy="230" r="28" fill="#F0DCC8"/>
  <line x1="357" y1="258" x2="357" y2="360" stroke="#F0DCC8" stroke-width="13" stroke-linecap="round"/>
  <!-- Right arm down -->
  <line x1="357" y1="290" x2="402" y2="330" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <!-- Left arm lifting child -->
  <line x1="357" y1="290" x2="312" y2="180" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <line x1="357" y1="360" x2="332" y2="440" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <line x1="357" y1="360" x2="382" y2="440" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>

  <!-- Child 2 being lifted (right side) -->
  <circle cx="302" cy="140" r="20" fill="#C65D28"/>
  <line x1="302" y1="160" x2="302" y2="220" stroke="#C65D28" stroke-width="9" stroke-linecap="round"/>
  <!-- Arms spread joyfully -->
  <line x1="302" y1="178" x2="272" y2="158" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="302" y1="178" x2="332" y2="160" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="302" y1="220" x2="287" y2="260" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="302" y1="220" x2="317" y2="260" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>

  <!-- Joy sparkles -->
  <circle cx="256" cy="100" r="5" fill="#C65D28" opacity="0.5"/>
  <circle cx="240" cy="115" r="3" fill="#C65D28" opacity="0.4"/>
  <circle cx="272" cy="112" r="3" fill="#C65D28" opacity="0.4"/>
</svg>