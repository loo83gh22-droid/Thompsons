<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#3A7D5C"/>

  <!-- Parents' arms form a heart shape above the family -->
  <!-- Heart formed by arms -->
  <path d="M140,200 Q140,120 256,160 Q372,120 372,200" fill="none" stroke="#F0DCC8" stroke-width="12" stroke-linecap="round"/>

  <!-- Left parent -->
  <circle cx="140" cy="230" r="28" fill="#F0DCC8"/>
  <line x1="140" y1="258" x2="140" y2="350" stroke="#F0DCC8" stroke-width="13" stroke-linecap="round"/>
  <line x1="140" y1="350" x2="115" y2="435" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <line x1="140" y1="350" x2="165" y2="435" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <!-- Lower arm wrapping around child -->
  <line x1="140" y1="290" x2="190" y2="320" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>

  <!-- Right parent -->
  <circle cx="372" cy="230" r="28" fill="#F0DCC8"/>
  <line x1="372" y1="258" x2="372" y2="350" stroke="#F0DCC8" stroke-width="13" stroke-linecap="round"/>
  <line x1="372" y1="350" x2="347" y2="435" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <line x1="372" y1="350" x2="397" y2="435" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <!-- Lower arm wrapping around child -->
  <line x1="372" y1="290" x2="322" y2="320" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>

  <!-- Small heart at the peak where arms meet -->
  <path d="M256,148 C256,148 248,140 248,134 C248,129 252,126 256,130 C260,126 264,129 264,134 C264,140 256,148 256,148Z" fill="#C65D28"/>

  <!-- Child 1 (left of center) -->
  <circle cx="215" cy="300" r="20" fill="#C65D28"/>
  <line x1="215" y1="320" x2="215" y2="388" stroke="#C65D28" stroke-width="10" stroke-linecap="round"/>
  <line x1="215" y1="345" x2="195" y2="368" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="215" y1="345" x2="240" y2="368" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="215" y1="388" x2="198" y2="435" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="215" y1="388" x2="232" y2="435" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>

  <!-- Child 2 (right of center) -->
  <circle cx="297" cy="300" r="20" fill="#C65D28"/>
  <line x1="297" y1="320" x2="297" y2="388" stroke="#C65D28" stroke-width="10" stroke-linecap="round"/>
  <line x1="297" y1="345" x2="277" y2="368" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="297" y1="345" x2="322" y2="368" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="297" y1="388" x2="280" y2="435" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="297" y1="388" x2="314" y2="435" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
</svg>