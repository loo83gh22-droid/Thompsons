<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#3A7D5C"/>

  <!-- Boat hull -->
  <path d="M80,360 Q90,420 256,430 Q422,420 432,360 Z" fill="#8B6914" stroke="#A07818" stroke-width="6"/>
  <!-- Boat deck line -->
  <line x1="95" y1="360" x2="417" y2="360" stroke="#A07818" stroke-width="8" stroke-linecap="round"/>

  <!-- Water waves -->
  <path d="M40,440 Q100,425 160,440 Q220,455 280,440 Q340,425 400,440 Q460,455 480,440" fill="none" stroke="#F0DCC8" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <path d="M30,465 Q90,450 150,465 Q210,480 270,465 Q330,450 390,465 Q450,480 485,465" fill="none" stroke="#F0DCC8" stroke-width="5" stroke-linecap="round" opacity="0.2"/>

  <!-- Mast / sail (parents' arms forming triangular sail) -->
  <line x1="256" y1="80" x2="256" y2="360" stroke="#F0DCC8" stroke-width="8" stroke-linecap="round"/>
  <!-- Sail -->
  <polygon points="256,90 256,280 380,280" fill="#F0DCC8" opacity="0.15" stroke="#F0DCC8" stroke-width="4"/>

  <!-- Left parent on boat -->
  <circle cx="175" cy="260" r="24" fill="#F0DCC8"/>
  <line x1="175" y1="284" x2="175" y2="350" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <line x1="175" y1="310" x2="148" y2="340" stroke="#F0DCC8" stroke-width="9" stroke-linecap="round"/>
  <line x1="175" y1="310" x2="210" y2="300" stroke="#F0DCC8" stroke-width="9" stroke-linecap="round"/>

  <!-- Right parent on boat -->
  <circle cx="337" cy="260" r="24" fill="#F0DCC8"/>
  <line x1="337" y1="284" x2="337" y2="350" stroke="#F0DCC8" stroke-width="11" stroke-linecap="round"/>
  <line x1="337" y1="310" x2="364" y2="340" stroke="#F0DCC8" stroke-width="9" stroke-linecap="round"/>
  <line x1="337" y1="310" x2="302" y2="300" stroke="#F0DCC8" stroke-width="9" stroke-linecap="round"/>

  <!-- Child 1 -->
  <circle cx="230" cy="290" r="17" fill="#C65D28"/>
  <line x1="230" y1="307" x2="230" y2="352" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="230" y1="322" x2="215" y2="340" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="230" y1="322" x2="248" y2="340" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>

  <!-- Child 2 -->
  <circle cx="282" cy="290" r="17" fill="#C65D28"/>
  <line x1="282" y1="307" x2="282" y2="352" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="282" y1="322" x2="267" y2="340" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="282" y1="322" x2="300" y2="340" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>

  <!-- Flag on mast -->
  <polygon points="256,80 256,110 290,95" fill="#C65D28"/>
</svg>