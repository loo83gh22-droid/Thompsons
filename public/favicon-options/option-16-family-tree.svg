<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#3A7D5C"/>

  <!-- Tree trunk -->
  <line x1="256" y1="460" x2="256" y2="280" stroke="#8B6914" stroke-width="22" stroke-linecap="round"/>

  <!-- Branches left and right -->
  <path d="M256,300 Q200,280 170,240" fill="none" stroke="#8B6914" stroke-width="12" stroke-linecap="round"/>
  <path d="M256,300 Q312,280 342,240" fill="none" stroke="#8B6914" stroke-width="12" stroke-linecap="round"/>

  <!-- Tree crown / canopy -->
  <ellipse cx="256" cy="170" rx="170" ry="130" fill="#2D5A44"/>
  <ellipse cx="256" cy="170" rx="160" ry="120" fill="#346B4E"/>

  <!-- Parent 1 (left branch) -->
  <circle cx="175" cy="170" r="24" fill="#F0DCC8"/>
  <line x1="175" y1="194" x2="175" y2="260" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="175" y1="220" x2="155" y2="245" stroke="#F0DCC8" stroke-width="8" stroke-linecap="round"/>
  <line x1="175" y1="220" x2="200" y2="245" stroke="#F0DCC8" stroke-width="8" stroke-linecap="round"/>

  <!-- Parent 2 (right branch) -->
  <circle cx="337" cy="170" r="24" fill="#F0DCC8"/>
  <line x1="337" y1="194" x2="337" y2="260" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="337" y1="220" x2="317" y2="245" stroke="#F0DCC8" stroke-width="8" stroke-linecap="round"/>
  <line x1="337" y1="220" x2="357" y2="245" stroke="#F0DCC8" stroke-width="8" stroke-linecap="round"/>

  <!-- Child 1 (center-left, higher up) -->
  <circle cx="230" cy="110" r="18" fill="#C65D28"/>
  <line x1="230" y1="128" x2="230" y2="185" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="230" y1="148" x2="214" y2="168" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="230" y1="148" x2="246" y2="168" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>

  <!-- Child 2 (center-right, higher up) -->
  <circle cx="282" cy="110" r="18" fill="#C65D28"/>
  <line x1="282" y1="128" x2="282" y2="185" stroke="#C65D28" stroke-width="8" stroke-linecap="round"/>
  <line x1="282" y1="148" x2="266" y2="168" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="282" y1="148" x2="298" y2="168" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>

  <!-- Ground line -->
  <ellipse cx="256" cy="462" rx="120" ry="12" fill="#2D5A44"/>
</svg>