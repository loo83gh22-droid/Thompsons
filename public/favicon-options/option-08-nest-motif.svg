<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#3A7D5C"/>

  <!-- Nest / bowl shape at bottom -->
  <path d="M100,340 Q110,430 256,440 Q402,430 412,340" fill="none" stroke="#8B6914" stroke-width="18" stroke-linecap="round"/>
  <path d="M120,350 Q130,420 256,428 Q382,420 392,350" fill="none" stroke="#A07818" stroke-width="12" stroke-linecap="round"/>
  <!-- Nest texture lines -->
  <path d="M140,360 Q200,395 256,400 Q312,395 372,360" fill="none" stroke="#8B6914" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- Parent figures forming protective arch above nest -->
  <!-- Left parent -->
  <circle cx="155" cy="145" r="28" fill="#F0DCC8"/>
  <line x1="155" y1="173" x2="155" y2="270" stroke="#F0DCC8" stroke-width="12" stroke-linecap="round"/>
  <line x1="155" y1="205" x2="110" y2="255" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="155" y1="205" x2="256" y2="100" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="155" y1="270" x2="130" y2="345" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="155" y1="270" x2="180" y2="345" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>

  <!-- Right parent -->
  <circle cx="357" cy="145" r="28" fill="#F0DCC8"/>
  <line x1="357" y1="173" x2="357" y2="270" stroke="#F0DCC8" stroke-width="12" stroke-linecap="round"/>
  <line x1="357" y1="205" x2="402" y2="255" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="357" y1="205" x2="256" y2="100" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="357" y1="270" x2="332" y2="345" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="357" y1="270" x2="382" y2="345" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>

  <!-- Roof peak -->
  <circle cx="256" cy="90" r="20" fill="#C65D28"/>

  <!-- Baby chick-like figures in nest -->
  <circle cx="220" cy="340" r="18" fill="#C65D28"/>
  <circle cx="256" cy="330" r="18" fill="#C65D28"/>
  <circle cx="292" cy="340" r="18" fill="#C65D28"/>
</svg>