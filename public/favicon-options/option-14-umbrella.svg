<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#3A7D5C"/>

  <!-- Umbrella canopy -->
  <path d="M80,210 Q256,50 432,210" fill="#2D5A44" stroke="#F0DCC8" stroke-width="12" stroke-linecap="round"/>
  <!-- Umbrella scallops -->
  <path d="M80,210 Q130,180 175,210 Q220,180 256,210 Q292,180 337,210 Q382,180 432,210" fill="none" stroke="#F0DCC8" stroke-width="8" stroke-linecap="round"/>
  <!-- Umbrella handle -->
  <line x1="256" y1="210" x2="256" y2="250" stroke="#F0DCC8" stroke-width="8" stroke-linecap="round"/>
  <!-- Handle curve -->
  <path d="M256,80 L256,95" stroke="#F0DCC8" stroke-width="8" stroke-linecap="round"/>

  <!-- Left parent holding umbrella -->
  <circle cx="175" cy="255" r="26" fill="#F0DCC8"/>
  <line x1="175" y1="281" x2="175" y2="365" stroke="#F0DCC8" stroke-width="12" stroke-linecap="round"/>
  <!-- Arm up to umbrella -->
  <line x1="175" y1="310" x2="245" y2="245" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <!-- Arm down -->
  <line x1="175" y1="310" x2="135" y2="345" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="175" y1="365" x2="152" y2="440" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="175" y1="365" x2="198" y2="440" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>

  <!-- Right parent -->
  <circle cx="337" cy="255" r="26" fill="#F0DCC8"/>
  <line x1="337" y1="281" x2="337" y2="365" stroke="#F0DCC8" stroke-width="12" stroke-linecap="round"/>
  <!-- Arm up to umbrella -->
  <line x1="337" y1="310" x2="267" y2="245" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <!-- Arm down -->
  <line x1="337" y1="310" x2="377" y2="345" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="337" y1="365" x2="314" y2="440" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>
  <line x1="337" y1="365" x2="360" y2="440" stroke="#F0DCC8" stroke-width="10" stroke-linecap="round"/>

  <!-- Child 1 -->
  <circle cx="228" cy="310" r="18" fill="#C65D28"/>
  <line x1="228" y1="328" x2="228" y2="392" stroke="#C65D28" stroke-width="9" stroke-linecap="round"/>
  <line x1="228" y1="348" x2="210" y2="368" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="228" y1="348" x2="246" y2="368" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="228" y1="392" x2="214" y2="435" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="228" y1="392" x2="242" y2="435" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>

  <!-- Child 2 -->
  <circle cx="284" cy="310" r="18" fill="#C65D28"/>
  <line x1="284" y1="328" x2="284" y2="392" stroke="#C65D28" stroke-width="9" stroke-linecap="round"/>
  <line x1="284" y1="348" x2="266" y2="368" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="284" y1="348" x2="302" y2="368" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="284" y1="392" x2="270" y2="435" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
  <line x1="284" y1="392" x2="298" y2="435" stroke="#C65D28" stroke-width="7" stroke-linecap="round"/>
</svg>